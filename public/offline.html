<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piura Alerta - Sin conexión</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0a2f52;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 400px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    p {
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      background: #b8862e;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #a07420;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Sin conexión</h1>
    <p>
      No tienes conexión a internet en este momento.
      <br />
      Los datos se actualizarán automáticamente cuando vuelvas a estar en línea.
    </p>
    <button onclick="window.location.reload()">
      Reintentar ahora
    </button>
  </div>
</body>
</html>
